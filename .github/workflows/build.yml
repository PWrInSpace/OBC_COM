name: STM32 Build CI

on:
  push:
    branches: [ "main", "master", "dev/*" ] # Dodane dev/* aby łapało Twoją obecną gałąź
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # ZADANIE 1: KOMPILACJA (GCC ARM)
  # ==========================================
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARM GCC Toolchain & Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi ninja-build cmake

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

    - name: Build project
      run: cmake --build build

  # ==========================================
  # ZADANIE 2: ANALIZA KODU (Clang)
  # ==========================================
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install clang-format
      run: pip install "clang-format==23.1.2"

    - name: Run clang-format check
      run: |
        find app cmd nvs proto wrappers modules Core -type f \( -name '*.c' -o -name '*.h' \) -print0 \
          | xargs -0 clang-format --dry-run --Werror
