name: STM32 Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARM GCC Toolchain & Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi ninja-build cmake

    - name: Configure CMake
      # Używamy ścieżki do pliku cmake w Twoim projekcie. Zmień "gcc-arm-none-eabi.cmake" 
      # jeśli Twój plik wygenerowany przez CubeMX nazywa się inaczej.
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

    - name: Build project
      run: cmake --build build
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Twoja akcja z poprawnie ustawioną wersją omijającą błędy Ubuntu Jammy
    - name: Set up Clang
      uses: egor-tensin/setup-clang@v2
      with:
        version: 17
        platform: x64

    # Przykładowe sprawdzenie formatowania (wymaga pliku .clang-format w repozytorium)
    - name: Run clang-format check
      run: |
        find Core/Src Core/Inc modules -name '*.c' -o -name '*.h' | xargs clang-format --dry-run --Werror
