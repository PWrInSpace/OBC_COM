name: STM32 Build CI

on:
  push:
    branches: [ "main", "master", "dev/*" ] # Dodane dev/* aby łapało Twoją obecną gałąź
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # ZADANIE 1: KOMPILACJA (GCC ARM)
  # ==========================================
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARM GCC Toolchain & Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi ninja-build cmake

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

    - name: Build project
      run: cmake --build build

  # ==========================================
  # ZADANIE 2: ANALIZA KODU (Clang)
  # ==========================================
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Clang
      uses: egor-tensin/setup-clang@v2
      with:
        version: 17
        platform: x64

    - name: Run clang-format check
      run: |
        find Core/Src Core/Inc modules -type f \( -name '*.c' -o -name '*.h' \) | grep -v -E "system_stm32|stm32h5xx_it|stm32h5xx_hal_msp|stm32h5xx_hal_conf" | xargs clang-format --dry-run --Werror
